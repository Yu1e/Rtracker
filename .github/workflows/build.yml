name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|AAPT|Unresolved|Caused by" -A2 build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReadingTracker-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ReadingTracker.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest ReadingTracker.apk \
            --title "Трекер чтения (последняя сборка)" \
            --notes "Скачайте ReadingTracker.apk и установите на телефон." \
            --target "${{ github.sha }}"
